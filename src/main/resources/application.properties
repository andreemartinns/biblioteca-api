spring.application.name=biblioteca-api
spring.datasource.url=jdbc:h2:mem:bibliotecadb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
springdoc.swagger-ui.custom-css=/swagger-custom.css
springdoc.swagger-ui.css-url=/swagger-custom.css
springdoc.swagger-ui.custom-css-url=/swagger-custom.css
app.admin-key=admin-demo-key-123
app.rate-limit.max-requests=30
app.rate-limit.window-seconds=60
app.idempotency.ttl-seconds=3600
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200