<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>API de Gestão de Biblioteca Comunitária</title>
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css">
    <link rel="stylesheet" href="/swagger-custom.css">
    <style>
        #seletor-versao {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px; border-radius: 8px;
            background: rgba(20, 14, 8, .92); border: 1px solid #e0ab62;
            color: #f5ecd9; font-family: sans-serif; font-size: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
        }
        #seletor-versao select {
            background: #f5ecd9; color: #1a120a; border: 0;
            border-radius: 6px; padding: 4px 8px; font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="fundo-video">
    <iframe src="https://www.youtube.com/embed/FQfsDannYBU?autoplay=1&mute=1&controls=0&loop=1&playlist=FQfsDannYBU&start=1920&modestbranding=1&playsinline=1&rel=0&disablekb=1"
            allow="autoplay; encrypted-media" tabindex="-1" title="Fundo"></iframe>
</div>

<div id="seletor-versao">
    <label for="versao">Select a definition</label>
    <select id="versao">
        <option value="v1">V1 - completa</option>
        <option value="v2">V2 - resumida</option>
    </select>
</div>

<div id="swagger-ui"></div>
<script src="/swagger-ui/swagger-ui-bundle.js"></script>
<script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>
<script>
    function ajustarHeader(op, versao) {
        const params = (op.parameters || []).filter(p => p.name !== "X-API-Version");
        params.push({
            name: "X-API-Version",
            in: "header",
            required: versao === "2",
            description: versao === "2"
                ? "Versão 2 (resumida)"
                : "Versão 1 (completa, com HATEOAS). Também é a padrão sem o cabeçalho.",
            schema: { type: "string", enum: [versao], default: versao }
        });
        op.parameters = params;
    }

    async function carregar(versao) {
        const resp = await fetch("/v3/api-docs");
        const spec = await resp.json();
        const op = spec.paths["/livros/{id}"].get;

        if (versao === "v2") {
            op.summary = "Buscar livro por ID (v2)";
            op.description = "Versão 2: resposta resumida, com o nome da categoria e a lista de nomes dos autores. "
                + "Exige o cabeçalho X-API-Version: 2.";
            op.responses = {
                "200": { description: "Livro encontrado (resumido)" },
                "404": { description: "Livro não encontrado" }
            };
            ajustarHeader(op, "2");
            spec.info.title += " - V2";
        } else {
            op.summary = "Buscar livro por ID (v1)";
            ajustarHeader(op, "1");
            spec.info.title += " - V1";
        }

        SwaggerUIBundle({
            spec: spec,
            dom_id: "#swagger-ui",
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "StandaloneLayout"
        });
    }

    window.onload = function () {
        const sel = document.getElementById("versao");
        sel.addEventListener("change", () => carregar(sel.value));
        carregar("v1");
    };
</script>
</body>
</html>
